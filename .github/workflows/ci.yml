name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu / Clang)
    runs-on: ubuntu-24.04

    env:
      CC:  clang-18
      CXX: clang++-18
      BUILD_DIR: build

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install toolchain ────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            clang-tidy-18 \
            cmake \
            ninja-build \
            libgtest-dev

          # Make clang-tidy-18 available as 'clang-tidy' on the PATH
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
            /usr/bin/clang-tidy-18 100

      # ── Configure ────────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B $BUILD_DIR \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Run CTest
        run: |
          ctest --test-dir $BUILD_DIR \
                --output-on-failure \
                --parallel

      # ── Lint (clang-tidy) ────────────────────────────────────────────────────
      - name: Run clang-tidy
        run: |
          echo "Collecting .cpp files under src/..."
          CPP_FILES=$(find src -name '*.cpp')
          echo "Files to lint:"
          echo "$CPP_FILES"

          for f in $CPP_FILES; do
            echo ":: $f"
            clang-tidy "$f" \
              -p "$BUILD_DIR" \
              --header-filter='^${{ github.workspace }}/(include|src)/.*' \
              -- -std=c++20 -Iinclude
          done
